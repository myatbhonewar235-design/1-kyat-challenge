<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 Kyat Challenge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 30px 15px;
    }
    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px #ccc;
    }
    h1 { font-size: 32px; }
    .amount {
      font-size: 42px;
      font-weight: bold;
      margin: 20px;
    }
    .goal {
      color: #555;
    }
    button {
      background: #198754;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>💰 1 Kyat Challenge</h1>

    <p>လူတစ်ယောက်စီက ၁ ကျပ်စီနဲ့ ကူညီပေးနိုင်ပါတယ်။</p>

    <div class="amount">1,000,000 Ks</div>

    <p class="goal">🎯 ရည်မှန်းချက် — ၁,၀၀၀,၀၀၀ ကျပ်</p>

    <button onclick="alert('ကျေးဇူးတင်ပါတယ် ❤️')">
      ၁ ကျပ် ပါဝင်မယ်
    </button>

    <p style="margin-top:25px;">
      မိမိဆန္ဒအလျောက်သာ ပါဝင်ပါ။
    </p>
  </div>
</body>
      </html>
