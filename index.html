<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ကူညီကြမယ်</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .box {
      max-width: 430px;
      margin: 40px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    .number {
      font-size: 23px;
      font-weight: bold;
      margin: 20px 0;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 12px;
    }

    .amounts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    .amount {
      background: #eee;
    }

    .amount:hover {
      background: #ddd;
    }

    .copy {
      width: 100%;
      background: #222;
      color: white;
      margin-bottom: 10px;
    }

    .wave {
      width: 100%;
      background: #6f42c1;
      color: white;
      margin-bottom: 10px;
    }

    .done {
      width: 100%;
      background: #ddd;
    }

    #selected {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    #message {
      display: none;
      margin-top: 20px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>❤️ ကူညီကြမယ်</h1>

    <p>
      မိမိအဆင်ပြေသလောက်<br>
      ကူညီပေးနိုင်ပါတယ်။
    </p>

    <h3>Wave Pay ဖုန်းနံပါတ်</h3>

    <!-- ဒီနေရာမှာ ကိုယ့် Wave Pay နံပါတ်ထည့်ပါ -->
    <div class="number" id="phone">
      09687352668
    </div>

    <button class="copy" onclick="copyNumber()">
      📋 ဖုန်းနံပါတ်ကူးမယ်
    </button>

    <h3>ကူညီမယ့်ပမာဏ ရွေးပါ</h3>

    <div class="amounts">
      <button class="amount" onclick="selectAmount(1)">1 ကျပ်</button>
      <button class="amount" onclick="selectAmount(5)">5 ကျပ်</button>
      <button class="amount" onclick="selectAmount(10)">10 ကျပ်</button>
      <button class="amount" onclick="selectAmount(20)">20 ကျပ်</button>
      <button class="amount" onclick="selectAmount(50)">50 ကျပ်</button>
      <button class="amount" onclick="selectAmount(100)">100 ကျပ်</button>
    </div>

    <div id="selected">
      ပမာဏ မရွေးရသေးပါ
    </div>

    <button class="wave" onclick="openWave()">
      💜 Wave Pay ဖွင့်မယ်
    </button>

    <button class="done" onclick="done()">
      ✅ ငွေလွှဲပြီးပြီ
    </button>

    <div id="message"></div>

  </div>

  <script>

    let selectedAmount = 0;

    function selectAmount(amount) {
      selectedAmount = amount;

      document.getElementById("selected").innerHTML =
        "ရွေးထားသောပမာဏ — " + amount + " ကျပ်";
    }

    function copyNumber() {
      const number = document.getElementById("phone").innerText;

      navigator.clipboard.writeText(number).then(function() {
        alert("Wave Pay ဖုန်းနံပါတ်ကို ကူးပြီးပါပြီ ✅");
      });
    }

    function openWave() {
      window.location.href = "https://wavemoney.com.mm/";
    }

    function done() {

      if (selectedAmount === 0) {
        alert("အရင်ဆုံး ကူညီမယ့်ပမာဏကို ရွေးပါ။");
        return;
      }

      document.getElementById("message").style.display = "block";

      document.getElementById("message").innerHTML =
        "❤️ " + selectedAmount +
        " ကျပ် ကူညီရန် ရွေးထားပါတယ်။<br><br>" +
        "ကျေးဇူးတင်ပါတယ်။";
    }

  </script>

</body>
</html>
