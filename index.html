<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>1 ကျပ်နဲ့ ကူညီကြမယ်</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .box {
      max-width: 430px;
      margin: 50px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    .number {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .copy {
      background: #222;
      color: white;
    }

    .wave {
      background: #6f42c1;
      color: white;
    }

    .done {
      background: #eee;
      color: #222;
    }

    #message {
      display: none;
      margin-top: 20px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>❤️ 1 ကျပ်နဲ့ ကူညီကြမယ်</h1>

    <p>
      လူတစ်ယောက်စီက 1 ကျပ်နဲ့<br>
      ကူညီပေးနိုင်ပါတယ်။
    </p>

    <h3>Wave Pay နံပါတ်</h3>

    <!-- ဒီနေရာမှာ ကိုယ့် Wave Pay ဖုန်းနံပါတ်ထည့်ပါ -->
    <div class="number" id="phone">
      09687352668
    </div>

    <button class="copy" onclick="copyNumber()">
      📋 ဖုန်းနံပါတ်ကူးမယ်
    </button>

    <button class="wave" onclick="openWave()">
      💜 Wave Pay ဖွင့်မယ်
    </button>

    <button class="done" onclick="done()">
      ✅ ငွေလွှဲပြီးပြီ
    </button>

    <div id="message"></div>

  </div>

  <script>

    function copyNumber() {
      const number = document.getElementById("phone").innerText;

      navigator.clipboard.writeText(number).then(function() {
        alert("Wave Pay ဖုန်းနံပါတ်ကို ကူးပြီးပါပြီ ✅");
      });
    }

    function openWave() {
      window.location.href = "https://wavemoney.com.mm/";
    }

    function done() {
      document.getElementById("message").style.display = "block";

      document.getElementById("message").innerHTML =
        "❤️ ကျေးဇူးတင်ပါတယ်။<br><br>" +
        "ငွေလွှဲပြီးပါပြီဆိုရင် ကျေးဇူးပြု၍ စောင့်ပေးပါ။";
    }

  </script>

</body>
</html>
