<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 ကျပ်နဲ့ ကူညီကြမယ်</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: 60px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 17px;
    }

    .amount {
      font-size: 32px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .thanks {
      display: none;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>❤️ ကူညီကြမယ်</h1>

    <p>
      လူတစ်ယောက်စီက 1 ကျပ်နဲ့<br>
      ကူညီပေးနိုင်ပါတယ်။
    </p>

    <div class="amount">
      1 ကျပ်
    </div>

    <button onclick="help(1)">
      1 ကျပ် ကူညီမယ်
    </button>

    <button onclick="help(5)">
      5 ကျပ် ကူညီမယ်
    </button>

    <button onclick="help(10)">
      10 ကျပ် ကူညီမယ်
    </button>

    <div class="thanks" id="thanks">
      ❤️ ကျေးဇူးတင်ပါတယ်။<br>
      သင့်ရဲ့ကူညီမှုကို မှတ်တမ်းတင်ထားပါတယ်။
    </div>

  </div>

  <script>
    function help(amount) {
      document.getElementById("thanks").style.display = "block";
      document.getElementById("thanks").innerHTML =
        "❤️ " + amount + " ကျပ် ကူညီရန် ရွေးချယ်ထားပါတယ်။<br><br>" +
        "ကျေးဇူးတင်ပါတယ်။";
    }
  </script>

</body>
</html>
